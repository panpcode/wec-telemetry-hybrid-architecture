services:

  # ── NATS with JetStream enabled ─────────────────────────────────────────────
  # -js turns on JetStream; -sd sets the file store directory.
  # Port 4222 → client connections; 8222 → HTTP monitoring endpoint.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── SeaweedFS (S3-compatible object storage for local dev) ───────────────────
  # Port 8333 → S3 API; 8888 → filer web UI (browse /buckets/wec-telemetry).
  # Credentials come from infrastructure/seaweedfs/s3.json (dev-only keys).
  # In production, remove this service and point cloud-uploader at real AWS S3.
  # The uploader creates the bucket on startup, so no init container is needed.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - seaweedfs-data:/data
      - ./infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── PostgreSQL (computed lap metrics + alerts) ───────────────────────────────
  # Schema is applied by the stream processor on startup.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Ingestion Service ────────────────────────────────────────────────────────
  # HTTP entry point: validates incoming ECU events and publishes to NATS JetStream.
  ingestion-service:
    build: ./services/ingestion-service
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ECU Simulator ────────────────────────────────────────────────────────────
  # Generates physics-based telemetry for N cars on the selected circuit.
  # Tune TRACK (le_mans / spa / imola), NUM_CARS, and PIT_EVERY_LAPS here.
  ecu-simulator:
    build: ./services/ecu-simulator
    environment:
      INGESTION_URL:   "http://ingestion-service:8080"
      NUM_CARS:        "3"
      TRACK:           "le_mans"
      SIM_HZ:          "20"
      SIM_DURATION:    "120m"
      PIT_EVERY_LAPS:  "8"
    depends_on:
      ingestion-service:
        condition: service_healthy
    restart: on-failure

  # ── Cloud Uploader ───────────────────────────────────────────────────────────
  # Drains the NATS JetStream stream and uploads gzip-compressed NDJSON batches
  # to SeaweedFS (or set S3_ENDPOINT to real AWS S3 in production).
  cloud-uploader:
    build: ./services/cloud-uploader
    environment:
      NATS_URL:          "nats://nats:4222"
      S3_ENDPOINT:       "http://seaweedfs:8333"
      S3_BUCKET:         "wec-telemetry"
      S3_ACCESS_KEY:     "wec-dev"
      S3_SECRET_KEY:     "wec-dev-secret"
      S3_USE_SSL:        "false"
      BATCH_SIZE:        "500"
      BATCH_TIMEOUT_SEC: "10"
    depends_on:
      nats:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: on-failure

  # ── Stream Processor ─────────────────────────────────────────────────────────
  # Aggregates raw events into per-lap metrics and threshold alerts in Postgres.
  stream-processor:
    build: ./services/stream-processor
    environment:
      NATS_URL:         "nats://nats:4222"
      DATABASE_URL:     "postgres://postgres:postgres@postgres:5432/telemetry?sslmode=disable"
      TIRE_TEMP_MAX_C:  "120"
      BRAKE_TEMP_MAX_C: "450"
      FUEL_LOW_L:       "8"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── Pit Wall Dashboard ───────────────────────────────────────────────────────
  # Real-time telemetry display for race engineers.
  # Open http://localhost:3000 in a browser.
  dashboard:
    build: ./services/dashboard
    ports:
      - "3000:3000"
    environment:
      NATS_URL:  "nats://nats:4222"
      HTTP_ADDR: ":3000"
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure

  # ── DuckDB (ad-hoc SQL over the S3 archive) ──────────────────────────────────
  # Not started by `up`; run it with `make query` or `make query-examples`.
  duckdb:
    build: ./analytics
    profiles: ["tools"]
    volumes:
      - ./analytics:/analytics:ro
    depends_on:
      - seaweedfs
      - postgres

volumes:
  nats-data:
  seaweedfs-data:
  postgres-data:
