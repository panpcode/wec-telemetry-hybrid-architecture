version: "3.9"

services:

  # ── NATS with JetStream enabled ─────────────────────────────────────────────
  # -js turns on JetStream; -sd sets the file store directory.
  # Port 4222 → client connections; 8222 → HTTP monitoring endpoint.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (S3-compatible object storage for local dev) ───────────────────────
  # Port 9000 → S3 API; 9001 → web console (minioadmin / minioadmin).
  # In production, remove this service and point cloud-uploader at real AWS S3.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── One-shot bucket initialiser ──────────────────────────────────────────────
  # Creates the wec-telemetry bucket the first time the stack comes up.
  # mc is the MinIO command-line client shipped with minio/mc.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/wec-telemetry &&
        echo 'Bucket ready: wec-telemetry'
      "
    restart: "no"

  # ── PostgreSQL (computed lap metrics + alerts) ───────────────────────────────
  # Schema is applied by the stream processor on startup.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Ingestion Service ────────────────────────────────────────────────────────
  # HTTP entry point: validates incoming ECU events and publishes to NATS JetStream.
  ingestion-service:
    build: ./services/ingestion-service
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ECU Simulator ────────────────────────────────────────────────────────────
  # Generates physics-based telemetry for N cars on the selected circuit.
  # Tune TRACK (le_mans / spa / imola), NUM_CARS, and PIT_EVERY_LAPS here.
  ecu-simulator:
    build: ./services/ecu-simulator
    environment:
      INGESTION_URL:   "http://ingestion-service:8080"
      NUM_CARS:        "3"
      TRACK:           "le_mans"
      SIM_HZ:          "20"
      SIM_DURATION:    "120m"
      PIT_EVERY_LAPS:  "8"
    depends_on:
      ingestion-service:
        condition: service_healthy
    restart: on-failure

  # ── Cloud Uploader ───────────────────────────────────────────────────────────
  # Drains the NATS JetStream stream and uploads gzip-compressed NDJSON batches
  # to MinIO (or swap S3_ENDPOINT for real AWS S3 in production).
  cloud-uploader:
    build: ./services/cloud-uploader
    environment:
      NATS_URL:          "nats://nats:4222"
      S3_ENDPOINT:       "http://minio:9000"
      S3_BUCKET:         "wec-telemetry"
      S3_ACCESS_KEY:     "minioadmin"
      S3_SECRET_KEY:     "minioadmin"
      S3_USE_SSL:        "false"
      BATCH_SIZE:        "500"
      BATCH_TIMEOUT_SEC: "10"
    depends_on:
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: on-failure

  # ── Stream Processor ─────────────────────────────────────────────────────────
  # Aggregates raw events into per-lap metrics and threshold alerts in Postgres.
  stream-processor:
    build: ./services/stream-processor
    environment:
      NATS_URL:         "nats://nats:4222"
      DATABASE_URL:     "postgres://postgres:postgres@postgres:5432/telemetry?sslmode=disable"
      TIRE_TEMP_MAX_C:  "120"
      BRAKE_TEMP_MAX_C: "450"
      FUEL_LOW_L:       "8"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── Pit Wall Dashboard ───────────────────────────────────────────────────────
  # Real-time telemetry display for race engineers.
  # Open http://localhost:3000 in a browser.
  dashboard:
    build: ./services/dashboard
    ports:
      - "3000:3000"
    environment:
      NATS_URL:  "nats://nats:4222"
      HTTP_ADDR: ":3000"
    depends_on:
      nats:
        condition: service_healthy
    restart: on-failure

volumes:
  nats-data:
  minio-data:
  postgres-data:
